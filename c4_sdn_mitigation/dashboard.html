<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>C4 SDN Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',sans-serif;font-size:14px}
header{background:#161b22;border-bottom:1px solid #30363d;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3fb950;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 24px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px}
.card label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px}
.val{font-size:28px;font-weight:700;margin-top:6px}
.sub{font-size:11px;color:#8b949e;margin-top:4px}
.green{color:#3fb950}.red{color:#f85149}.blue{color:#58a6ff}.yellow{color:#d29922}.orange{color:#fb8f44}
.section{padding:0 24px 20px}
.section h2{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden}
th{background:#1c2128;color:#8b949e;font-size:11px;text-transform:uppercase;padding:10px 14px;text-align:left;border-bottom:1px solid #30363d}
td{padding:10px 14px;border-bottom:1px solid #21262d;font-size:13px}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2128}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
.b-block{background:#3d1a1a;color:#f85149}
.b-rate{background:#2d2a1a;color:#d29922}
.b-honey{background:#1a2a3d;color:#58a6ff}
.b-mon{background:#1a2d1a;color:#3fb950}
.b-crit{background:#3d1a1a;color:#f85149}
.b-high{background:#2d2318;color:#fb8f44}
.b-med{background:#2d2a1a;color:#d29922}
.b-low{background:#1a2d1a;color:#3fb950}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dcard{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px}
.dcard.alert{border-color:#f85149}
.dname{font-size:12px;font-weight:600}
.dip{font-size:11px;color:#8b949e}
.dst{font-size:11px;margin-top:2px}
.logbox{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;font-family:monospace;font-size:12px;height:160px;overflow-y:auto;color:#3fb950}
.logline{margin-bottom:3px}
.lw{color:#d29922}.le{color:#f85149}.li{color:#58a6ff}
.btn{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.btn:hover{background:#30363d}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
</style></head>
<body>
<header>
  <div><span class="dot"></span><strong>Component 4 &mdash; SDN Mitigation Dashboard</strong></div>
  <div style="text-align:right">
    <div style="font-size:12px;color:#8b949e">A.A.N. Dulsara | IT23344006 | J-26-CS-314</div>
    <div style="font-size:11px;color:#8b949e" id="clk"></div>
  </div>
</header>
<div class="grid">
  <div class="card"><label>Controller</label><div class="val green" id="ks">—</div><div class="sub" id="kc">Checking...</div></div>
  <div class="card"><label>Connected Switches</label><div class="val blue" id="ksw">—</div><div class="sub">OpenFlow 1.3</div></div>
  <div class="card"><label>Total Incidents</label><div class="val yellow" id="ki">—</div><div class="sub">Since startup</div></div>
  <div class="card"><label>ML Model</label><div class="val green" id="km">—</div><div class="sub">Random Forest &middot; InSDN 92%</div></div>
</div>
<div class="section">
  <h2>IoMT Devices</h2>
  <div class="dgrid" id="dg"></div>
</div>
<div class="section">
  <div class="topbar"><h2>Recent Incidents</h2><button class="btn" onclick="go()">&#8635; Refresh</button></div>
  <table><thead><tr><th>#</th><th>Time</th><th>Device</th><th>Attack</th><th>Severity</th><th>ML</th><th>Conf</th><th>Action</th></tr></thead>
  <tbody id="tb"><tr><td colspan="8" style="color:#8b949e;text-align:center">Loading...</td></tr></tbody></table>
</div>
<div class="section">
  <h2>Activity Log</h2>
  <div class="logbox" id="lb"><div class="logline li">[--:--:--] Dashboard started</div></div>
</div>
<script>
const B='http://localhost:8080';
const DEVS=[
  {n:'Ventilator',ip:'10.0.0.1',ic:'&#129625;'},
  {n:'Insulin Pump',ip:'10.0.0.2',ic:'&#128137;'},
  {n:'Infusion Pump',ip:'10.0.0.3',ic:'&#129658;'},
  {n:'Cardiac Mon',ip:'10.0.0.4',ic:'&#129872;'},
  {n:'BP Monitor',ip:'10.0.0.5',ic:'&#128202;'},
  {n:'Patient Srv',ip:'10.0.0.10',ic:'&#128421;'},
  {n:'Admin Srv',ip:'10.0.0.11',ic:'&#9881;'},
  {n:'Honeypot',ip:'10.0.0.99',ic:'&#127855;'},
];
let logs=[], blocked=new Set();
function log(m,t=''){const ts=new Date().toLocaleTimeString();logs.unshift({m,t,ts});if(logs.length>40)logs.pop();document.getElementById('lb').innerHTML=logs.map(l=>`<div class="logline ${l.t?'l'+l.t:''}">[${l.ts}] ${l.m}</div>`).join('');}
function ab(a){const m={block:['b-block','BLOCK'],rate_limit:['b-rate','RATE LIMIT'],redirect_honeypot:['b-honey','HONEYPOT'],monitor:['b-mon','MONITOR']};const v=m[a]||['b-mon',a];return`<span class="badge ${v[0]}">${v[1]}</span>`;}
function sb(s){const m={Critical:'b-crit',High:'b-high',Medium:'b-med',Low:'b-low'};return`<span class="badge ${m[s]||'b-low'}">${s}</span>`;}
function rd(){document.getElementById('dg').innerHTML=DEVS.map(d=>`<div class="dcard ${blocked.has(d.ip)?'alert':''}"><div style="font-size:20px">${d.ic}</div><div><div class="dname">${d.n}</div><div class="dip">${d.ip}</div><div class="dst ${blocked.has(d.ip)?'red':'green'}">${blocked.has(d.ip)?'&#9888; BLOCKED':'&#10003; Normal'}</div></div></div>`).join('');}
async function go(){
  log('Refreshing...','i');
  try{
    const h=await fetch(B+'/api/v1/health').then(r=>r.json());
    document.getElementById('ks').textContent=h.status==='healthy'?'HEALTHY':'ERROR';
    document.getElementById('ks').className='val '+(h.status==='healthy'?'green':'red');
    document.getElementById('kc').textContent=h.component||'';
    document.getElementById('ksw').textContent=h.switches??'—';
    document.getElementById('ki').textContent=h.incidents??'—';
  }catch(e){document.getElementById('ks').textContent='OFFLINE';document.getElementById('ks').className='val red';log('Controller offline','e');}
  try{
    const s=await fetch(B+'/api/v1/status').then(r=>r.json());
    document.getElementById('km').textContent=s.ml_model_loaded?'LOADED':'NOT LOADED';
    document.getElementById('km').className='val '+(s.ml_model_loaded?'green':'red');
  }catch(e){}
  try{
    const d=await fetch(B+'/api/v1/incidents').then(r=>r.json());
    const inc=d.incidents||[];
    blocked=new Set(inc.filter(i=>i.action_taken==='block').map(i=>i.device_ip));
    rd();
    const tb=document.getElementById('tb');
    if(!inc.length){tb.innerHTML='<tr><td colspan="8" style="color:#8b949e;text-align:center">No incidents yet</td></tr>';return;}
    tb.innerHTML=[...inc].reverse().slice(0,10).map(i=>{
      const t=new Date(i.timestamp).toLocaleTimeString();
      const ml=i.ml_prediction;
      const ms=ml&&ml.available?`${ml.class} (${(ml.confidence*100).toFixed(0)}%)`:'N/A';
      return`<tr><td style="color:#8b949e">#${i.id}</td><td style="color:#8b949e">${t}</td><td><strong>${i.device_id}</strong><br><span style="color:#8b949e;font-size:11px">${i.device_ip||''}</span></td><td>${i.attack_type}</td><td>${sb(i.severity)}</td><td style="color:#58a6ff">${ms}</td><td>${(i.confidence*100).toFixed(0)}%</td><td>${ab(i.action_taken)}</td></tr>`;
    }).join('');
    log(`${inc.length} incident(s) loaded`);
  }catch(e){log('Failed to fetch incidents','e');}
}
rd();go();
setInterval(go,10000);
setInterval(()=>document.getElementById('clk').textContent=new Date().toLocaleString(),1000);
</script>
</body></html>
